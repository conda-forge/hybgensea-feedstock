context:
  name: hybgensea
  version: "0.3.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/hybgensea-${{ version }}.tar.gz
  sha256: f6f416415718c1e854515411aaed604d0fd3ddba4acafbc8a03f02e4e9365aad

build:
  number: 0
  skip:
    - match(python, "<3.10")
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - if: unix
      then: make
  host:
    - python
    - scikit-build-core >=1.0
    - nanobind >=2.2
    - setuptools-scm >=8
    - pip
  run:
    - python
    - numpy

tests:
  - python:
      imports:
        - hybgensea
      pip_check: true
  - requirements:
      run:
        - pytest
    script:
      - pytest --pyargs hybgensea.tests

about:
  homepage: https://github.com/mdealencar/HybGenSea
  repository: https://github.com/mdealencar/HybGenSea
  summary: Wrapper for the Hybrid Genetic Search algorithm for Capacitated Vehicle Routing Problems (HGS-CVRP)
  license: MIT
  license_file:
    - LICENSE
    - HGS-CVRP/LICENSE

extra:
  recipe-maintainers:
    - mdealencar
    - simutisernestas
